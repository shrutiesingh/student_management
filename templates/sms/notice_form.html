{% extends 'sms/base.html' %}
{% block title %}Post Notice – EduPro{% endblock %}
{% block page_title %}Post Notice{% endblock %}
{% block content %}

<div class="section-header fade-in">
  <div>
    <div class="section-title">Post a Notice</div>
    <div class="section-subtitle">Announcements will be visible on all dashboards</div>
  </div>
</div>

<div class="card fade-in" style="max-width:700px">
  <div class="card-header-custom">
    <h5><i class="bi bi-megaphone-fill me-2 text-primary"></i>New Notice</h5>
  </div>
  <div class="card-body-custom">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label-custom">Title *</label>
        <input type="text" name="title" class="form-control-custom" required placeholder="Notice title…"/>
      </div>
      <div class="mb-3">
        <label class="form-label-custom">Content *</label>
        <textarea name="content" class="form-control-custom" rows="5" required
          placeholder="Write the notice content here…" style="resize:vertical"></textarea>
      </div>
      <div class="mb-4">
        <label class="form-label-custom">Audience *</label>
        <select name="audience" class="form-select-custom">
          <option value="all">All (Students + Teachers)</option>
          <option value="student">Students Only</option>
          <option value="teacher">Teachers Only</option>
        </select>
      </div>
      <div class="d-flex gap-3">
        <button type="submit" class="btn-primary-custom">
          <i class="bi bi-send-fill"></i> Post Notice
        </button>
        <a href="{% url 'notice_list' %}" class="btn-secondary-custom">
          <i class="bi bi-x"></i> Cancel
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
